name: Release installers

# Builds .dmg (Apple Silicon + Intel, one after the other on one Mac runner), .msi, .AppImage and .deb on a version tag, or when run by hand.
# The release is tagged v<version from tauri.conf.json>.
# Builds are unsigned until signing secrets are added; the macOS steps pick them up
# automatically (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID) for signing and notarization.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
          - os: windows-latest
            args: ""
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Signing is optional. Passing empty certificate variables makes the macOS bundler fail,
      # so they are exported only when the secrets exist; otherwise the app is ad-hoc signed.
      - name: Apple signing secrets (optional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              echo "$v=${!v}" >> "$GITHUB_ENV"
            done
          else
            echo "No signing certificate: building an ad-hoc signed app."
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: StatNext v__VERSION__
          releaseBody: |
            ## Install StatNext

            | Your computer | Download |
            |---|---|
            | Mac with Apple silicon (M1 or later) | `StatNext_…_aarch64.dmg` |
            | Mac with Intel processor | `StatNext_…_x64.dmg` |
            | Windows | `StatNext_…_x64-setup.exe` (or the `.msi`) |
            | Linux | `.AppImage` (any distribution) or `.deb` (Ubuntu, Debian) |

            1. Download the file for your computer and double-click it. On a Mac, drag StatNext into Applications.
            2. Open StatNext. If R is not installed yet, StatNext shows a Download R button and continues by itself once R is installed.
            3. The first launch installs the statistics packages (3 to 10 minutes, needs internet). Later launches start at once.

            **macOS:** this build is not notarized yet. The first time, macOS blocks it: open System Settings › Privacy & Security and click **Open Anyway**.
            **Windows:** if SmartScreen appears, click **More info › Run anyway**.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
      # Intel Mac build on the same runner: a second macOS job often waits for a runner until it is cancelled.
      - if: runner.os == 'macOS'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: StatNext v__VERSION__
          releaseDraft: false
          prerelease: true
          args: --target x86_64-apple-darwin
